<!DOCTYPE html>
<html>
<head>
    <title>Diabetes Prediction</title>
</head>
<body>
    <h2>Diabetes Prediction (Flask Client)</h2>

    <h3>Detected Server IP: <span style="color:green">{{ server_ip }}</span></h3>

    <!--
    <p>Use this API URL:</p>
    <code>{{ predict_url }}</code>
    -->

    <!-- Separator line between info and form -->
    <hr>    

    <h2>Diabetes Prediction Form</h2>

    <form action="/predict" method="POST">

    <label>Pregnancies:</label>
    <input type="number" name="Pregnancies" value="6" required><br><br>

    <label>Glucose:</label>
    <input type="number" name="Glucose" value="148" required><br><br>

    <label>Blood Pressure:</label>
    <input type="number" name="BloodPressure" value="72" required><br><br>

    <label>Skin Thickness:</label>
    <input type="number" name="SkinThickness" value="35" required><br><br>

    <label>Insulin:</label>
    <input type="number" name="Insulin" value="0" required><br><br>

    <label>BMI:</label>
    <input type="number" step="0.1" name="BMI" value="33.6" required><br><br>

    <label>Diabetes Pedigree:</label>
    <input type="number" step="0.01" name="DiabetesPedigreeFunction" value="0.627" required><br><br>

    <label>Age:</label>
    <input type="number" name="Age" value="50" required><br><br>

    <button type="submit">Predict</button>

    </form>
</body>
</html>
